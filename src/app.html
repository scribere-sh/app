<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />

        <!--
            Multiple icons, lets the browser choose whichever format they prefer.

            Ordered in preference of which once we want
        -->
        <link
            rel="icon"
            type="image/svg+xml"
            href="%sveltekit.assets%/favicon.svg"
        >
        <link
            rel="icon"
            type="image/png"
            href="%sveltekit.assets%/favicon.png"
        />
        <link
            rel="icon"
            type="image/x-icon"
            href="%sveltekit.assets%/favicon.ico"
        />

        <link rel="stylesheet" href="https://use.typekit.net/psh5enk.css">

        <meta name="viewport" content="width=device-width, initial-scale=1" />

        %sveltekit.head%
    </head>
    <body
        data-sveltekit-preload-data="hover"
        class="[background:var(--app-background)]"
    >
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
